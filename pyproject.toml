[project]
name = "lastgreen"
version = "0.1.0"
description = "Compare a failing GitHub Actions job with the last green run of the same job and see what changed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "thanatchon36" }]
keywords = ["github-actions", "ci", "debugging", "logs", "diff"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thanatchon36/lastgreen"
Issues = "https://github.com/thanatchon36/lastgreen/issues"

[project.scripts]
lastgreen = "lastgreen.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
